name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  quality-gate:
    name: ✅ Quality & Build Check
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🔍 Lint Check
        run: npm run lint

      - name: 🏗️ Type Check
        run: npm run type-check

      - name: 🚀 Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ github.event.pull_request.head.repo.html_url || 'https://portfolio-mahmoud-zanoun.vercel.app' }}
          NODE_ENV: production
